# nginx vhost สำหรับ POWER UP! (deploy.sh จะแทนค่า __APP_DIR__ / __PHP_SOCK__ ให้)
server {
    listen 80 default_server;
    server_name _;
    root __APP_DIR__;
    index index.html;

    # --- ความปลอดภัยพื้นฐานตามโจทย์ ---
    # 1) ห้ามเข้าถึงไฟล์ JSON/ข้อมูลผ่าน URL ตรงๆ (ผู้ตรวจจะลองดาวน์โหลด data)
    location ~* /\.          { deny all; }   # dotfiles (.git ฯลฯ)
    location ~* \.(json|md)$ { deny all; }   # *.json/*.md ทุกไฟล์ใน webroot
    location /data/          { deny all; }

    # 2) PHP ผ่าน php-fpm เท่านั้น — ไม่ serve ไฟล์ php ดิบ
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:__PHP_SOCK__;
        fastcgi_read_timeout 30s;
    }

    # 3) static assets cache เบาๆ
    location ~* \.(css|js|png|jpg|svg|ico)$ {
        expires 1h;
        access_log off;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
}
