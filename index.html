<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <title>Power Up! Portfolio</title>
</head>

<body>
  <header>
    <nav class="navbar navbar-expand-lg navbar-light relative-position" style="background-color: #e3f2fd;">
      <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="#">Power up! Portfolio</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#maintoggler">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="maintoggler">
          <ul class="navbar-nav fw-bold custom-nav ms-auto gap-2">
            <li class="nav-item"><a class="nav-link" href="#Home">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="#portfolio-form-section">Portlio Form</a>
            </li>
            <li class="nav-item"><a class="nav-link" href="#item-form-section">Add Item</a></li>
            <li class="nav-item"><a class="nav-link" href="#portfolio-view">Preview</a></li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <main class="container my-5">
    <section id="Home">
      <div class="container">
        <div class="row align-items-center">
          <div class="col-12 col-md-6 text-center text-md-start">
            <h2 class="mb-4 fw-bold">Personal Learning Portfolio</h2>
            <h4>Start to create your own portfolio</h4>
            <div class="d-flex justify-content-center justify-content-md-start">
              <a href="#portfolio-form-section" class="btn btn-primary">Create Portfolio</a>
            </div>
          </div>

          <div class="col-12 col-md-6 text-center">
            <img
              src="https://cdni.iconscout.com/illustration/premium/thumb/designer-portfolio-illustration-svg-download-png-7155167.png"
              class="port-img" alt="port-img">
          </div>
        </div>
      </div>
    </section>

    <!-- ===== Create Portfolio Form ===== -->
    <section id="portfolio-form-section" class="card shadow-sm border-0 rounded-4 mb-5">
      <div class="card-body">
        <h2>Portfolio information</h2>

        <form id="portfolio-form" novalidate>
          <div class="row g-3 mb-3">
            <div class="col-md-6 ">
              <label for="first-name" class="form-label">First name</label>
              <input type="text" class="form-control" name="first-name" required>
            </div>
            <div class="col-md-6 mt-3">
              <label for="last-name" class="form-label">Last name</label>
              <input type="text" class="form-control" name="last-name" required>
            </div>
          </div>

          <div class="mb-3">
            <label for="What-i-enjoy" class="form-label">What I Enjoy</label>
            <textarea class="form-control form-control-lg" id="What-i-enjoy" row="4" required></textarea>
          </div>

          <div class="mb-3">
            <label for="What-i've-tried" class="form-label">What I've Tried</label>
            <textarea class="form-control form-control-lg" id="what-i-tried" row="4" required></textarea>
          </div>

          <div class="mb-3">
            <label for="What-I'm-Curious-About" class="form-label">What I'm Curious About</label>
            <textarea class="form-control form-control-lg" id="What-I'm-Curious-About" row="4" required></textarea>
          </div>
          <div class="d-grid d-md-flex justify-content-md-end">
            <button type="Save" class="btn btn-primary">Save</button>
          </div>
        </form>
      </div>

    </section>


    <!-- ===== Add Portfolio Item Form ===== -->
    <section id="item-form-section"></section>

    <!-- ===== Portfolio View ===== -->
    <section id="portfolio-view"></section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/validate.js"></script>
  <script src="js/render.js"></script>
  <script src="js/app.js"></script>
</body>

</html>
