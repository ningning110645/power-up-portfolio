<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <title>Power Up! Portfolio</title>
</head>

<body>
    <main class="container my-5">
        <h1 class="mb-4">Personal Learning Portfolio</h1>

        <!-- ===== Create Portfolio Form ===== -->
        <section id="portfolio-form-section"></section>

        <!-- ===== Add Portfolio Item Form ===== -->
        <section id="item-form-section" class="card shadow-sm border-0 rounded-4 mb-5">
            <div class="card-body p-4">
                <h2 class="h4 mb-4">Add Portfolio Item</h2>

                <form id="item-form" novalidate>
                    <div class="mb-3">
                        <label for="portfolio-select" class="form-label">Portfolio</label>
                        <select id="portfolio-select" name="portfolioId" class="form-select" required>
                            <option value="">-- Select a portfolio --</option>
                        </select>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label for="title" class="form-label">Title</label>
                            <input type="text" id="title" name="title" class="form-control" required>
                        </div>
                        <div class="col-md-3">
                            <label for="type" class="form-label">Type</label>
                            <select id="type" name="type" class="form-select" required>
                                <option value="">-- Select --</option>
                                <option>Course Assignment</option>
                                <option>Personal Project</option>
                                <option>Activity</option>
                                <option>Competition</option>
                                <option>Other</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label for="date" class="form-label">Date</label>
                            <input type="date" id="date" name="date" class="form-control" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="role" class="form-label">Role</label>
                        <input type="text" id="role" name="role" class="form-control" placeholder="e.g. Developer"
                            required>
                    </div>

                    <div class="mb-3">
                        <label for="description" class="form-label">Description</label>
                        <textarea id="description" name="description" class="form-control" rows="3" required></textarea>
                    </div>

                    <div class="mb-4">
                        <label for="skills" class="form-label">Skills</label>
                        <input type="text" id="skills" name="skills" class="form-control"
                            placeholder="HTML, CSS, Teamwork" required>
                        <div class="form-text">Separate skills with commas</div>
                    </div>

                    <h3 class="h6 mb-3">Reflection</h3>
                    <div class="row g-3 mb-4">
                        <div class="col-md-6">
                            <label for="whatIDid" class="form-label">What I did</label>
                            <textarea id="whatIDid" name="whatIDid" class="form-control" rows="2" required></textarea>
                        </div>
                        <div class="col-md-6">
                            <label for="whatILearned" class="form-label">What I learned</label>
                            <textarea id="whatILearned" name="whatILearned" class="form-control" rows="2"
                                required></textarea>
                        </div>
                        <div class="col-md-6">
                            <label for="challenge" class="form-label">Challenge</label>
                            <textarea id="challenge" name="challenge" class="form-control" rows="2" required></textarea>
                        </div>
                        <div class="col-md-6">
                            <label for="nextStep" class="form-label">Next step</label>
                            <textarea id="nextStep" name="nextStep" class="form-control" rows="2" required></textarea>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="evidence" class="form-label">Evidence links</label>
                        <textarea id="evidence" name="evidence" class="form-control" rows="2"
                            placeholder="https://example.com/my-work" required></textarea>
                        <div class="form-text">One URL per line (at least 1)</div>
                    </div>

                    <div class="d-grid d-md-flex justify-content-md-end">
                        <button type="submit" class="btn btn-primary px-4">Add Item</button>
                    </div>
                </form>
            </div>
        </section>

        <!-- ===== Portfolio View ===== -->
        <section id="portfolio-view"></section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/validate.js"></script>
    <script src="js/render.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
